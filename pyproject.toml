[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-bench-agent"
version = "0.1.0"
description = "Coding-agent skill document evolution with train and frozen-test workflows"
requires-python = ">=3.11"
dependencies = ["pyyaml", "jinja2", "python-dotenv", "platformdirs", "rich", "litellm>=1.75.5", "datasets", "wandb"]

[project.scripts]
rsi = "rsi.cli:main"

[tool.setuptools.packages.find]
include = ["rsi*"]

# rsi/__init__.py puts the vendored upstreams on sys.path at runtime; mirror that for static analysis.
[tool.basedpyright]
venvPath = "."
venv = ".venv-py314"
extraPaths = ["vendor/reasoning-bank/third_party/src", "vendor/harbor/src", "vendor/SWE-bench"]
exclude = ["vendor", "runs", "datasets", ".venv", ".venv-py314"]
typeCheckingMode = "standard"
