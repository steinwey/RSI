# Same Qwen, reflection and skill settings as the parallel arm.
provider: qwen-token-plan
allowed_models:
- qwen3.8-max
model:
  name: qwen3.8-max
  provider: qwen-token-plan
  custom_llm_provider: openai
  api_base: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  api_key_env: QWEN_TOKEN_PLAN_API_KEY
  extra_body:
    enable_thinking: false
  temperature: 0.7
  max_tokens: 4096
  timeout: 120
  num_retries: 2
judge_model:
  name: qwen3.8-max
  provider: qwen-token-plan
  custom_llm_provider: openai
  api_base: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  api_key_env: QWEN_TOKEN_PLAN_API_KEY
  extra_body: &id001
    enable_thinking: false
  temperature: 0.0
  max_tokens: 8192
  timeout: 180
  num_retries: 2
rollouts: 1
planner_enabled: false
step_limit: 60
cost_limit: 3.0
command_timeout: 180
image_pull_timeout: 7200
rollout_timeout: 1800
evaluation_timeout: 1800
swe_dataset: SWE-bench/SWE-bench_Verified
swe_split: test
gate_image: python:3.12-slim
terminal_artifacts: []
evolve: true
wandb:
  project: rsi
reflection_enabled: true
reflection_max_rounds: 5
reflection_step_limit: 20
reflection_model:
  name: qwen3.8-max
  provider: qwen-token-plan
  custom_llm_provider: openai
  api_base: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  api_key_env: QWEN_TOKEN_PLAN_API_KEY
  extra_body: *id001
  temperature: 0.0
  max_tokens: 8192
  timeout: 180
  num_retries: 2
execution_mode: single
